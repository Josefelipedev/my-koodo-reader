version: "3.8"

services:
  koodo-reader:
    build: .
    image: my-koodo-reader:latest
    container_name: koodo-reader
    restart: unless-stopped
    ports:
      - "8090:80"      # Caddy: React app + Go API proxy
      - "7200:7200"    # KOReader sync (optional)
    environment:
      - ENABLE_HTTP_SERVER=true
      - ENABLE_OPDS=true
      - ENABLE_KOREADER_SERVER=${ENABLE_KOREADER_SERVER:-false}
      - KOREADER_PORT=7200
      - KOREADER_ENABLE_REGISTRATION=true
      - SERVER_USERNAME=${SERVER_USERNAME:-admin}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-securePass123}
    volumes:
      - /opt/koodo-reader/uploads:/app/uploads
